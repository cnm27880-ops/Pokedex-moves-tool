<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶可夢查詢網頁</title>
    <style>
        :root {
            --pokedex-red: #DC0A2D;
            --pokedex-dark: #2B292C;
            --bg-color: #F5F5F5;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--pokedex-dark);
            padding-bottom: 50px;
        }

        /* --- Header --- */
        header {
            background-color: var(--pokedex-red);
            padding: 15px 20px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .blue-lens {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe);
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,242,254, 0.5);
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        /* --- Controls --- */
        .controls {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 150px;
            flex: 1;
        }

        .search-group {
            flex: 2;
            min-width: 250px;
        }

        .search-box {
            display: flex;
            gap: 5px;
        }

        label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #666;
        }

        input, select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--pokedex-red);
        }

        #searchBtn {
            background-color: var(--pokedex-dark);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.2s;
            white-space: nowrap;
        }

        #searchBtn:hover {
            background-color: #444;
        }

        /* --- Grid --- */
        .moves-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* --- Card --- */
        .card {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s;
            border-left: 6px solid #ccc;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .move-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: #333;
        }

        .move-type {
            padding: 4px 12px;
            border-radius: 20px;
            color: #F5F5F5;
            font-size: 0.85rem;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #555;
        }

        .stat-label {
            font-weight: bold;
            color: #888;
            margin-right: 5px;
        }

        .effect-box {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #444;
            border-top: 1px solid #eee;
            padding-top: 10px;
            margin-top: 5px;
        }

        /* 深色屬性卡片字體調整 */
        .card.type-草 .move-name, .card.type-草 .effect-box,
        .card.type-毒 .move-name, .card.type-毒 .effect-box,
        .card.type-超能者 .move-name, .card.type-超能者 .effect-box,
        .card.type-水 .move-name, .card.type-水 .effect-box,
        .card.type-火 .move-name, .card.type-火 .effect-box,
        .card.type-惡 .move-name, .card.type-惡 .effect-box,
        .card.type-幽靈 .move-name, .card.type-幽靈 .effect-box,
        .card.type-地面 .move-name, .card.type-地面 .effect-box,
        .card.type-龍 .move-name, .card.type-龍 .effect-box,
        .card.type-鋼 .move-name, .card.type-鋼 .effect-box {
            color: #F5F5F5;
        }

        /* --- Type Colors --- */
        .type-一般 { background-color: #D3D3D3; border-color: #D3D3D3; color: #333; }
        .type-火 { background-color: #930000; border-color: #930000; }
        .type-水 { background-color: #2A7FEF; border-color: #2A7FEF; }
        .type-草 { background-color: #2A7F06; border-color: #2A7F06; }
        .type-冰 { background-color: #3DD8FF; border-color: #3DD8FF; color: #333; }
        .type-妖精 { background-color: #FAC2FF; border-color: #FAC2FF; color: #333; }
        .type-電 { background-color: #FAC000; border-color: #FAC000; color: #333; }
        .type-地面 { background-color: #915221; border-color: #915221; }
        .type-格鬥 { background-color: #FF8138; border-color: #FF8138; }
        .type-毒 { background-color: #9343CB; border-color: #9343CB; }
        .type-飛行 { background-color: #78B4ED; border-color: #78B4ED; color: #333; }
        .type-超能者 { background-color: #EF437A; border-color: #EF437A; }
        .type-蟲 { background-color: #8FA419; border-color: #8FA419; }
        .type-岩石 { background-color: #AFA683; border-color: #AFA683; }
        .type-幽靈 { background-color: #512F4F; border-color: #512F4F; }
        .type-龍 { background-color: #6670CC; border-color: #6670CC; }
        .type-惡 { background-color: #50413F; border-color: #50413F; }
        .type-鋼 { background-color: #61A5B8; border-color: #61A5B8; }
        .type-變量, .type-變量屬性 { background-color: #777; border-color: #777; }

        /* 特殊卡片背景 */
        .card.type-草 { background-color: #2A7F06; }
        .card.type-毒 { background-color: #9343CB; }
        .card.type-超能者 { background-color: #EF437A; }
        .card.type-水 { background-color: #2A7FEF; }
        .card.type-火 { background-color: #930000; }
        .card.type-惡 { background-color: #50413F; }
        .card.type-幽靈 { background-color: #512F4F; }
        .card.type-地面 { background-color: #915221; }
        .card.type-龍 { background-color: #6670CC; }
        .card.type-鋼 { background-color: #61A5B8; }

        .no-results { grid-column: 1 / -1; text-align: center; padding: 40px; color: #888; }
        .results-count { max-width: 1200px; margin: 0 auto 10px auto; padding: 0 20px; color: #666; font-size: 0.9rem; }

        @media (max-width: 768px) {
            .controls { flex-direction: column; align-items: stretch; }
            .search-box { flex-direction: row; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <div class="blue-lens"></div>
        <h1>寶可夢查詢網頁</h1>
    </div>
</header>

<div class="controls">
    <div class="input-group search-group">
        <label>招式名稱</label>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="輸入名稱 (例如: 水流)...">
            <button id="searchBtn">搜尋</button>
        </div>
    </div>

    <div class="input-group">
        <label>屬性</label>
        <select id="typeFilter">
            <option value="all">全部屬性</option>
        </select>
    </div>

    <div class="input-group">
        <label>分類</label>
        <select id="catFilter">
            <option value="all">全部分類</option>
            <option value="攻擊">物理 (攻擊)</option>
            <option value="特攻">特殊 (特攻)</option>
            <option value="效果">變化 (效果)</option>
            <option value="變化">變化 (變化)</option>
        </select>
    </div>

    <div class="input-group">
        <label>傷害骰</label>
        <select id="diceFilter">
            <option value="all">全部</option>
            <option value="d4">D4</option>
            <option value="d6">D6</option>
            <option value="d8">D8</option>
            <option value="d10">D10</option>
            <option value="d12">D12</option>
            <option value="d20">D20</option>
        </select>
    </div>
</div>

<div id="resultsCount" class="results-count"></div>
<div id="results" class="moves-grid"></div>

document.addEventListener('DOMContentLoaded', () => {
    const resultsContainer = document.getElementById('results');
    const resultsCount = document.getElementById('resultsCount');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const typeFilter = document.getElementById('typeFilter');
    const catFilter = document.getElementById('catFilter');
    const diceFilter = document.getElementById('diceFilter');

    populateTypes();
    renderMoves(movesData);

    searchBtn.addEventListener('click', executeFilter);
    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') executeFilter(); });
    typeFilter.addEventListener('change', executeFilter);
    catFilter.addEventListener('change', executeFilter);
    diceFilter.addEventListener('change', executeFilter);

    function populateTypes() {
        const uniqueTypes = new Set();
        movesData.forEach(m => {
            if (m.type) uniqueTypes.add(m.type.trim());
        });
        Array.from(uniqueTypes).sort().forEach(type => {
            const option = document.createElement('option');
            option.value = type;
            option.textContent = type;
            typeFilter.appendChild(option);
        });
    }

    function executeFilter() {
        const term = searchInput.value.toLowerCase().trim();
        const type = typeFilter.value;
        const cat = catFilter.value;
        const dice = diceFilter.value;

        const filtered = movesData.filter(move => {
            const matchName = move.name.toLowerCase().includes(term);
            const matchType = type === 'all' || move.type === type;
            const matchCat = cat === 'all' || move.category === cat;
            let matchDice = true;
            if (dice !== 'all') {
                matchDice = move.damage && move.damage.toLowerCase().includes(dice);
            }
            return matchName && matchType && matchCat && matchDice;
        });
        renderMoves(filtered);
    }
// --- 新增：資安防護函式 (防止 XSS 攻擊) ---
    function escapeHTML(text) {
        if (!text) return text;
        const div = document.createElement('div');
        div.textContent = text; // 這裡會自動把特殊符號轉義，變成純文字
        return div.innerHTML;
    }
    function renderMoves(moves) {
        resultsContainer.innerHTML = '';
        resultsCount.textContent = `找到 ${moves.length} 個招式`;
        if (moves.length === 0) {
            resultsContainer.innerHTML = '<div class="no-results">找不到符合條件的招式</div>';
            return;
        }

        moves.forEach(move => {
            // 處理雙屬性或變量的 CSS 類名 (只取第一個或過濾掉斜線)
            const typeClass = move.type.split('/')[0].replace(/[()]/g, '');
            
            const card = document.createElement('div');
            card.className = `card type-${typeClass}`;
            card.innerHTML = `
                <div class="card-header">
                    <span class="move-name">${move.name}</span>
                    <span class="move-type type-${typeClass}">${move.type}</span>
                </div>
                <div class="stats-grid">
                    <div><span class="stat-label">分類:</span>${move.category}</div>
                    <div><span class="stat-label">傷害:</span>${move.damage}</div>
                    <div><span class="stat-label">範圍:</span>${move.range}</div>
                    <div><span class="stat-label">頻率:</span>${move.frequency}</div>
                </div>
                <div class="effect-box">${escapeHTML(move.effect)}</div>
            `;
            resultsContainer.appendChild(card);
        });
    }
});
</script>
